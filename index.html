<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messy Sensing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #F2EEE7; transition: background 400ms; }
[data-theme="dark"] body { background: #0E1012; }
canvas { display: block; width: 100%; height: 100%; cursor: none; }
canvas.hovering { cursor: none; }

#cursor-blob {
  position: fixed; left: 0; top: 0;
  pointer-events: none; z-index: 99999;
  color: #141212; opacity: .88; will-change: transform; transition: color 280ms, opacity 180ms;
}
[data-theme="dark"] #cursor-blob { color: #F0EBE2; }
#cursor-blob.hidden { opacity: 0; }

.theme-btn {
  position: fixed;
  top: 20px; right: 28px;
  z-index: 20;
  background: none;
  border: 1px solid currentColor;
  border-radius: 100px;
  cursor: pointer;
  color: #141212;
  opacity: .50;
  padding: 7px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: .14em;
  text-transform: uppercase;
  transition: opacity 200ms;
}
[data-theme="dark"] .theme-btn { color: #F0EBE2; }
.theme-btn:hover { opacity: 1; }
</style>
</head>
<body>

<canvas id="map"></canvas>

<button class="theme-btn" id="theme-btn" aria-label="toggle theme">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
    <defs>
      <mask id="cm">
        <rect width="24" height="24" fill="white"/>
        <circle class="cut-c" r="6" fill="black"/>
      </mask>
    </defs>
    <g class="sun-r" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <line x1="12" y1="2"    x2="12" y2="4.5"/>
      <line x1="12" y1="19.5" x2="12" y2="22"/>
      <line x1="2"  y1="12"   x2="4.5" y2="12"/>
      <line x1="19.5" y1="12" x2="22" y2="12"/>
      <line x1="4.93" y1="4.93"   x2="6.75" y2="6.75"/>
      <line x1="17.25" y1="17.25" x2="19.07" y2="19.07"/>
      <line x1="19.07" y1="4.93"  x2="17.25" y2="6.75"/>
      <line x1="6.75"  y1="17.25" x2="4.93"  y2="19.07"/>
    </g>
    <circle class="sun-o" cx="12" cy="12" r="4.5" fill="currentColor" mask="url(#cm)"/>
  </svg>
  <span id="theme-label">Dark</span>
</button>

<script>
// ====== DATA ======
const PLACES = [
  // ---- projects ----
  { id: 'voicing-places',   label: 'Voicing Places',         sub: '2024 – 25',
    type: 'project', x: 0.42, y: 0.40, href: 'work/voicing-places/' },
  { id: 'group-shows',      label: 'Group Exhibitions',      sub: '2024 – 25',
    type: 'project', x: 0.63, y: 0.30, href: 'work/group-exhibitions/' },
  { id: 'river-becoming',   label: 'River Becoming',         sub: '2023 – 24',
    type: 'project', x: 0.57, y: 0.57, href: 'work/river-becoming/' },
  { id: 'murky-voices',     label: 'Murky Voices',           sub: '2023 – 24',
    type: 'project', x: 0.50, y: 0.51, href: 'work/murky-voices/' },
  { id: 'beeing-beecoming', label: 'Beeing, Beecoming',      sub: '2022 – 23',
    type: 'project', x: 0.30, y: 0.63, href: 'work/beeing-beecoming/' },
  { id: 'a-word-fell-out',  label: 'A Word Fell Out',        label2: 'of My Mouth and Broke',
    sub: '2022',     type: 'project', x: 0.10, y: 0.73, href: 'work/a-word-fell-out/' },
  { id: 'requiem',          label: 'Requiem for a Belief',   sub: '2021',
    type: 'project', x: 0.22, y: 0.82, href: 'work/requiem-for-a-belief/' },

  // ---- navigation ----
  { id: 'about',   label: 'About',   sub: '', type: 'nav', x: 0.83, y: 0.19, href: 'info.html#people'  },
  { id: 'archive', label: 'Archive', sub: '', type: 'nav', x: 0.52, y: 0.88, href: 'info.html#archive' },
  // { id: 'listen',  label: 'Listen',   sub: '', type: 'nav', x: 0.15, y: 0.22, href: 'info.html#listen'  }, // section removed, see dev-notes.md
  // { id: 'work',    label: 'All Work', sub: '', type: 'nav', x: 0.14, y: 0.46, href: 'work/'             }, // hidden until work grid is polished, see dev-notes.md
];

const TERRITORIES = [
  { cx: 0.42, cy: 0.40, r: 0.135, pts: 16, seed: 3  }, // voicing places
  { cx: 0.63, cy: 0.28, r: 0.090, pts: 12, seed: 17 }, // group exhibitions
  { cx: 0.57, cy: 0.55, r: 0.125, pts: 14, seed: 7  }, // river becoming
  { cx: 0.50, cy: 0.51, r: 0.058, pts: 10, seed: 41 }, // murky voices (small, overlaps river becoming)
  { cx: 0.30, cy: 0.63, r: 0.100, pts: 12, seed: 11 }, // beeing beecoming
  { cx: 0.10, cy: 0.73, r: 0.048, pts: 8,  seed: 53 }, // a word fell out (distant, small)
  { cx: 0.22, cy: 0.82, r: 0.048, pts: 8,  seed: 59 }, // requiem (near a word fell out)
  // decorative satellite islands
  { cx: 0.48, cy: 0.34, r: 0.028, pts: 7,  seed: 23 },
  { cx: 0.05, cy: 0.88, r: 0.026, pts: 7,  seed: 29 },
  { cx: 0.71, cy: 0.66, r: 0.024, pts: 7,  seed: 37 },
  { cx: 0.06, cy: 0.62, r: 0.020, pts: 6,  seed: 43 },
  { cx: 0.90, cy: 0.58, r: 0.018, pts: 6,  seed: 47 },
];

const CONNECTIONS = [
  ['voicing-places', 'river-becoming'],
  ['river-becoming', 'murky-voices'],
  ['river-becoming', 'beeing-beecoming'],
  ['voicing-places', 'group-shows'],
];

// ====== THEME ======
const html = document.documentElement;
const saved = localStorage.getItem('ms-theme');
if (saved) html.dataset.theme = saved;
else if (window.matchMedia('(prefers-color-scheme: dark)').matches) html.dataset.theme = 'dark';

function syncIcon() {
  const dark = html.dataset.theme === 'dark';
  document.querySelector('.cut-c').setAttribute('cx', dark ? '14.5' : '20');
  document.querySelector('.cut-c').setAttribute('cy', dark ? '9.5'  : '4');
  document.querySelector('.sun-r').style.opacity = dark ? '0' : '1';
  document.querySelector('.sun-o').setAttribute('r', dark ? '5.5' : '4.5');
  document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';
}
syncIcon();

document.getElementById('theme-btn').addEventListener('click', () => {
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('ms-theme', next);
  syncIcon();
  draw();
});

function isDark() { return html.dataset.theme === 'dark'; }

function palette() {
  return isDark() ? {
    fg:    '#F0EBE2',
    fgA:   'rgba(240,235,226,',
    land:  ['rgba(70,110,120,', 'rgba(122,82,112,', 'rgba(200,165,108,'],
    sea:   'rgba(240,235,226,',
  } : {
    fg:    '#141212',
    fgA:   'rgba(20,18,18,',
    land:  ['rgba(90,107,74,', 'rgba(179,165,184,', 'rgba(181,159,154,'],
    sea:   'rgba(20,18,18,',
  };
}

// ====== NOISE ======
function hash(x, y, s) {
  const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.3) * 43758.5453;
  return n - Math.floor(n);
}
function snoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  return hash(ix,iy,s)*(1-ux)*(1-uy)
       + hash(ix+1,iy,s)*ux*(1-uy)
       + hash(ix,iy+1,s)*(1-ux)*uy
       + hash(ix+1,iy+1,s)*ux*uy;
}

// ====== GEOMETRY ======
function makeBlob(cx, cy, baseR, numPts, seed, W, H) {
  const px = cx*W, py = cy*H, r = baseR * Math.min(W,H);
  const pts = [];
  for (let i = 0; i < numPts; i++) {
    const a = (i/numPts)*Math.PI*2;
    const n = snoise(Math.cos(a)*2.5 + seed*10, Math.sin(a)*2.5 + seed*10, seed);
    const rad = r * (0.65 + n*0.70);
    pts.push({ x: px + Math.cos(a)*rad, y: py + Math.sin(a)*rad });
  }
  return pts;
}

function drawSmooth(ctx, pts) {
  const n = pts.length;
  if (n < 2) return;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
    if (i === 0) ctx.moveTo(p1.x, p1.y);
    ctx.bezierCurveTo(
      p1.x+(p2.x-p0.x)/6, p1.y+(p2.y-p0.y)/6,
      p2.x-(p3.x-p1.x)/6, p2.y-(p3.y-p1.y)/6,
      p2.x, p2.y
    );
  }
  ctx.closePath();
}

function scaledBlob(pts, cx, cy, s) {
  return pts.map(p => ({ x: cx+(p.x-cx)*s, y: cy+(p.y-cy)*s }));
}

// ====== CANVAS ======
const canvas = document.getElementById('map');
const ctx    = canvas.getContext('2d');
const offscreen = document.createElement('canvas');
const offCtx    = offscreen.getContext('2d');
let W = 0, H = 0;
let cursorX = null, cursorY = null;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width  = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  offscreen.width  = canvas.width;
  offscreen.height = canvas.height;
  offCtx.setTransform(1, 0, 0, 1, 0, 0);
  offCtx.scale(dpr, dpr);
}

// ====== DRAW TERRAIN (offscreen, redrawn only on resize or theme change) ======
function drawTerrain() {
  if (!W) return;
  const C = palette();
  offCtx.clearRect(0, 0, W, H);

  // sea texture
  offCtx.save();
  offCtx.strokeStyle = C.sea + '0.04)';
  offCtx.lineWidth = 0.5;
  const lg = Math.max(H/80, 6);
  for (let y = 0; y < H; y += lg) {
    offCtx.beginPath(); offCtx.moveTo(0, y); offCtx.lineTo(W, y); offCtx.stroke();
  }
  offCtx.restore();

  // coordinate grid
  offCtx.save();
  offCtx.strokeStyle = C.fgA + '0.05)';
  offCtx.lineWidth = 0.5;
  for (let x = W/9; x < W; x += W/9) {
    offCtx.beginPath(); offCtx.moveTo(x, 0); offCtx.lineTo(x, H); offCtx.stroke();
  }
  for (let y = H/7; y < H; y += H/7) {
    offCtx.beginPath(); offCtx.moveTo(0, y); offCtx.lineTo(W, y); offCtx.stroke();
  }
  offCtx.restore();

  // territories
  TERRITORIES.forEach((t, i) => {
    const pts = makeBlob(t.cx, t.cy, t.r, t.pts, t.seed, W, H);
    const px  = t.cx*W, py = t.cy*H;
    const lc  = C.land[i % 3];

    offCtx.save();

    drawSmooth(offCtx, pts);
    offCtx.fillStyle = lc + '0.12)';
    offCtx.fill();

    drawSmooth(offCtx, pts);
    offCtx.save();
    offCtx.clip();
    offCtx.strokeStyle = lc + '0.09)';
    offCtx.lineWidth = 0.5;
    for (let d = -(H+W); d < W+H; d += 7) {
      offCtx.beginPath(); offCtx.moveTo(d, 0); offCtx.lineTo(d+H, H); offCtx.stroke();
    }
    offCtx.restore();

    [0.76, 0.54].forEach(s => {
      drawSmooth(offCtx, scaledBlob(pts, px, py, s));
      offCtx.strokeStyle = lc + '0.18)';
      offCtx.lineWidth = 0.7;
      offCtx.stroke();
    });

    drawSmooth(offCtx, pts);
    offCtx.strokeStyle = lc + '0.52)';
    offCtx.lineWidth = 1.2;
    offCtx.stroke();

    offCtx.restore();
  });

  // connection paths (dashed)
  offCtx.save();
  offCtx.setLineDash([3, 9]);
  offCtx.lineWidth = 0.8;
  offCtx.strokeStyle = C.fgA + '0.12)';
  CONNECTIONS.forEach(([aId, bId], ci) => {
    const a = PLACES.find(p => p.id === aId);
    const b = PLACES.find(p => p.id === bId);
    if (!a || !b) return;
    const ax = a.x*W, ay = a.y*H, bx = b.x*W, by = b.y*H;
    const off = (hash(ci, 0, 55) - 0.5) * Math.min(W,H) * 0.07;
    offCtx.beginPath();
    offCtx.moveTo(ax, ay);
    offCtx.quadraticCurveTo((ax+bx)/2+off, (ay+by)/2 - Math.abs(off)*0.5, bx, by);
    offCtx.stroke();
  });
  offCtx.setLineDash([]);
  offCtx.restore();

  // place dots + labels
  PLACES.forEach(p => {
    const px = p.x*W, py = p.y*H;
    const isProject = p.type === 'project';

    offCtx.save();
    offCtx.fillStyle = C.fg;
    offCtx.beginPath();
    offCtx.arc(px, py, isProject ? 3.5 : 2.5, 0, Math.PI*2);
    offCtx.globalAlpha = isProject ? 0.78 : 0.38;
    offCtx.fill();
    if (isProject) {
      offCtx.beginPath();
      offCtx.arc(px, py, 7, 0, Math.PI*2);
      offCtx.strokeStyle = C.fg;
      offCtx.globalAlpha = 0.15;
      offCtx.lineWidth = 0.8;
      offCtx.stroke();
    }
    offCtx.restore();

    offCtx.save();
    offCtx.fillStyle = C.fg;
    if (isProject) {
      const hasL2 = !!p.label2;
      offCtx.globalAlpha = 0.82;
      offCtx.font = 'italic 400 17px "EB Garamond", Georgia, serif';
      offCtx.fillText(p.label, px+13, py + (hasL2 ? -10 : -5));
      if (hasL2) offCtx.fillText(p.label2, px+13, py+7);
      if (p.sub) {
        offCtx.globalAlpha = 0.30;
        offCtx.font = '300 9px "Inter", system-ui, sans-serif';
        offCtx.fillText(p.sub, px+13, py + (hasL2 ? 20 : 9));
      }
    } else {
      offCtx.globalAlpha = 0.36;
      offCtx.font = '300 9px "Inter", system-ui, sans-serif';
      offCtx.fillText(p.label.toUpperCase(), px+10, py+4);
    }
    offCtx.restore();
  });

  // scale bar
  drawScaleBar(offCtx, W/2, H-28, 72, C);

  // title ghost (bottom left)
  offCtx.save();
  const ts = Math.max(26, Math.min(W*0.038, 48));
  offCtx.globalAlpha = 0.12;
  offCtx.fillStyle = C.fg;
  offCtx.font = `italic 400 ${ts}px "EB Garamond", Georgia, serif`;
  offCtx.fillText('Messy Sensing', 44, H - 40);
  offCtx.restore();
}

// Composite terrain + live compass (called on every mousemove)
function drawFrame() {
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(offscreen, 0, 0, W, H);
  drawCompass(ctx, W-58, H-66, 28, palette(), cursorX, cursorY);
}

function draw() {
  drawTerrain();
  drawFrame();
}

// Compass needle follows cursor. mx/my are null when cursor is off-canvas.
function drawCompass(ctx, cx, cy, r, C, mx, my) {
  ctx.save();
  ctx.strokeStyle = C.fg;
  ctx.fillStyle   = C.fg;

  // outer ring
  ctx.globalAlpha = 0.17;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.stroke();

  // tick marks
  for (let i = 0; i < 8; i++) {
    const a = (i/8)*Math.PI*2;
    ctx.globalAlpha = i%2===0 ? 0.14 : 0.07;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r*0.82, cy+Math.sin(a)*r*0.82);
    ctx.lineTo(cx+Math.cos(a)*r,      cy+Math.sin(a)*r);
    ctx.stroke();
  }

  // main needle — points toward cursor, confidently labeled "N"
  const needleAngle = (mx !== null && my !== null)
    ? Math.atan2(my - cy, mx - cx)
    : 148 * Math.PI/180 - Math.PI/2;

  const tx = cx + Math.cos(needleAngle)*r*0.78;
  const ty = cy + Math.sin(needleAngle)*r*0.78;

  ctx.globalAlpha = 0.40;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx+Math.cos(needleAngle+2.5)*6, ty+Math.sin(needleAngle+2.5)*6);
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx+Math.cos(needleAngle-2.5)*6, ty+Math.sin(needleAngle-2.5)*6);
  ctx.stroke();

  ctx.globalAlpha = 0.46;
  ctx.font = 'italic 400 11px "EB Garamond", Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('N', tx+Math.cos(needleAngle)*9, ty+Math.sin(needleAngle)*9+4);

  // second confused mini-arrow, fixed direction, labeled "N?"
  const confused = 312 * Math.PI/180 - Math.PI/2;
  const ex = cx+Math.cos(confused)*r*0.44;
  const ey = cy+Math.sin(confused)*r*0.44;
  ctx.globalAlpha = 0.13;
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.globalAlpha = 0.17;
  ctx.font = '300 7px "Inter", system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('N?', ex+2, ey);

  // disclaimer
  ctx.globalAlpha = 0.17;
  ctx.font = '300 6.5px "Inter", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('calibration pending', cx, cy+r+11);
  ctx.fillText('est. 2019', cx, cy+r+19);

  ctx.restore();
}

function drawScaleBar(ctx, cx, cy, len, C) {
  ctx.save();
  ctx.globalAlpha = 0.16;
  ctx.strokeStyle = C.fg;
  ctx.fillStyle   = C.fg;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(cx-len/2, cy); ctx.lineTo(cx+len/2, cy);
  ctx.moveTo(cx-len/2, cy-3); ctx.lineTo(cx-len/2, cy+3);
  ctx.moveTo(cx+len/2, cy-3); ctx.lineTo(cx+len/2, cy+3);
  ctx.stroke();
  ctx.font = '300 7px "Inter", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('distances may vary', cx, cy+12);
  ctx.restore();
}

// ====== HIT TEST ======
function hitPlace(mx, my) {
  return PLACES.find(p => {
    const px = p.x*W, py = p.y*H;
    const dx = px - mx, dy = py - my;
    if (Math.sqrt(dx*dx+dy*dy) < 20) return true;
    if (mx >= px + 8 && mx <= px + 220) {
      const yRange = p.label2 ? 30 : 22;
      if (my >= py - yRange && my <= py + yRange) return true;
    }
    return false;
  });
}

const COMP_L = ['#9B5A78', '#6B8A4A', '#4A6B8A'];
const COMP_D = ['#C87860', '#78B870', '#6C7FC8'];

canvas.addEventListener('mousemove', e => {
  cursorX = e.clientX;
  cursorY = e.clientY;
  const p = hitPlace(e.clientX, e.clientY);
  canvas.classList.toggle('hovering', !!p);
  const comp = document.getElementById('cursor-blob');
  if (comp) {
    if (p && p.type === 'project') {
      const idx = PLACES.indexOf(p);
      comp.style.color = (isDark() ? COMP_D : COMP_L)[idx % 3];
    } else {
      comp.style.color = '';
    }
  }
  drawFrame();
});
canvas.addEventListener('mouseleave', () => {
  cursorX = null;
  cursorY = null;
  const comp = document.getElementById('cursor-blob');
  if (comp) comp.style.color = '';
  drawFrame();
});
canvas.addEventListener('click', e => {
  const p = hitPlace(e.clientX, e.clientY);
  if (p) window.location.href = p.href;
});
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const p = hitPlace(t.clientX, t.clientY);
  if (p) window.location.href = p.href;
}, { passive: true });

// ====== BLOB CURSOR ======
(function () {
  const blob = document.createElement('div');
  blob.id = 'cursor-blob';
  blob.className = 'hidden';
  blob.innerHTML = '<svg width="20" height="17" viewBox="0 0 20 17" fill="currentColor" xmlns="http://www.w3.org/2000/svg">'
    + '<path d="M10,2 C13,1 17,3 18,6.5 C19,10 17,14 13,15 C9.5,16 5,14.5 3,11.5 C1,8.5 2,4 5,2.5 C6.5,1.5 8.5,2.5 10,2Z"/>'
    + '</svg>';
  document.body.appendChild(blob);

  document.addEventListener('mousemove', e => {
    blob.style.transform = 'translate(' + (e.clientX - 10) + 'px,' + (e.clientY - 8) + 'px)';
    blob.classList.remove('hidden');
  });
  document.addEventListener('mouseleave', () => blob.classList.add('hidden'));
})();

// ====== INIT ======
window.addEventListener('resize', () => { resize(); draw(); });
document.fonts.ready.then(() => { resize(); draw(); });
</script>
</body>
</html>
