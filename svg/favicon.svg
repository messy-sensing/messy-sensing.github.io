<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .dot  { fill: #141212; }
    .ring { fill: none; stroke: #141212; stroke-width: 1.6; opacity: .45; }
    @media (prefers-color-scheme: dark) {
      .dot  { fill: #F0EBE2; }
      .ring { stroke: #F0EBE2; }
    }
  </style>
  <circle class="dot"  cx="16" cy="16" r="7"/>
  <circle class="ring" cx="16" cy="16" r="13.2"/>
</svg>
