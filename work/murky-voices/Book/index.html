<style>
.book-page {
  position: relative;
  z-index: 1;
  padding-top: 100px;
  padding-bottom: 60px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.book-back {
  align-self: flex-start;
  margin: 0 0 32px 52px;
  font-size: 11px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--fg);
  text-decoration: none;
  opacity: .38;
  transition: opacity 200ms;
}
.book-back::before { content: '← '; }
.book-back:hover { opacity: 1; }

.book-heading {
  align-self: flex-start;
  margin: 0 0 40px 52px;
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(18px, 2vw, 28px);
  opacity: .45;
}

.book-stage {
  flex: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 32px;
}

/* StPageFlip mounts inside #book */
#book { box-shadow: 0 8px 48px rgba(0,0,0,.18); }
[data-theme="dark"] #book { box-shadow: 0 8px 48px rgba(0,0,0,.55); }

/* Page styles — replace inner content with <img> once images are ready */
.page {
  background: #F5F1EA;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
[data-theme="dark"] .page { background: #1a1c1f; }

.page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  user-select: none;
  pointer-events: none;
}

.page-placeholder {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: var(--fg);
  opacity: .2;
}

.book-controls {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-top: 36px;
}

.book-btn {
  background: none;
  border: 1px solid currentColor;
  color: var(--fg);
  cursor: pointer;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  font-size: 15px;
  opacity: .35;
  transition: opacity 200ms;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.book-btn:hover:not(:disabled) { opacity: 1; }
.book-btn:disabled { opacity: .1; cursor: default; }

.book-counter {
  font-size: 10px;
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: .35;
  font-family: var(--sans);
  min-width: 64px;
  text-align: center;
}

.book-hint {
  margin-top: 16px;
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  opacity: .2;
  font-family: var(--sans);
}

@media (max-width: 600px) {
  .book-back, .book-heading { margin-left: 24px; }
  .book-stage { padding: 0 16px; }
}

<script src="https://unpkg.com/page-flip/dist/js/page-flip.browser.js"></script>
<script>
const bookEl  = document.getElementById('book');
const counter = document.getElementById('counter');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

const pageFlip = new St.PageFlip(bookEl, {
  width:    500,
  height:   704,
  size:     'stretch',
  minWidth: 240,
  maxWidth: 660,
  minHeight: 338,
  maxHeight: 930,
  showCover:           true,
  mobileScrollSupport: false,
  flippingTime:        650,
  usePortrait:         true,
  autoSize:            true,
  swipeDistance:       30,
  clickEventForward:   true,
});

pageFlip.loadFromHTML(document.querySelectorAll('#book .page'));

function updateControls() {
  const cur   = pageFlip.getCurrentPageIndex();
  const total = pageFlip.getPageCount();
  counter.textContent = (cur + 1) + ' / ' + total;
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur >= total - 1;
}

pageFlip.on('flip',        updateControls);
pageFlip.on('changeState', updateControls);
updateControls();

btnPrev.addEventListener('click', () => pageFlip.flipPrev());
btnNext.addEventListener('click', () => pageFlip.flipNext());

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  pageFlip.flipPrev();
  if (e.key === 'ArrowRight') pageFlip.flipNext();
});
</script>
