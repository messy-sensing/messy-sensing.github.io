// Portrait archipelago: islands stacked top to bottom, alternating left/right.
const TERRITORIES_PORTRAIT = [

  { cx: 0.76, cy: 0.210, r: 0.130, pts: 12, seed: 17 }, // group exhibitions
  { cx: 0.70, cy: 0.390, r: 0.170, pts: 14, seed: 7  }, // river becoming
  { cx: 0.26, cy: 0.300, r: 0.090, pts: 10, seed: 41 }, // murky voices
  { cx: 0.72, cy: 0.555, r: 0.130, pts: 12, seed: 11 }, // beeing beecoming
  { cx: 0.22, cy: 0.645, r: 0.070, pts: 8,  seed: 53 }, // a word fell out
  { cx: 0.68, cy: 0.735, r: 0.070, pts: 8,  seed: 59 }, // requiem

// ====== THEME ======
const html = document.documentElement;
const saved = localStorage.getItem('ms-theme');
if (saved) html.dataset.theme = saved;
else if (window.matchMedia('(prefers-color-scheme: dark)').matches) html.dataset.theme = 'dark';

function syncIcon() {
  const dark = html.dataset.theme === 'dark';
  document.querySelector('.cut-c').setAttribute('cx', dark ? '14.5' : '20');
  document.querySelector('.cut-c').setAttribute('cy', dark ? '9.5'  : '4');
  document.querySelector('.sun-r').style.opacity = dark ? '0' : '1';
  document.querySelector('.sun-o').setAttribute('r', dark ? '5.5' : '4.5');
  document.getElementById('theme-label').textContent = dark ? 'Light' : 'Dark';
}
syncIcon();

document.getElementById('theme-btn').addEventListener('click', () => {
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  localStorage.setItem('ms-theme', next);
  syncIcon();
  draw();
});

function isDark() { return html.dataset.theme === 'dark'; }

function palette() {
  return isDark() ? {
    fg:    '#F0EBE2',
    fgA:   'rgba(240,235,226,',
    land:  ['rgba(70,110,120,', 'rgba(122,82,112,', 'rgba(200,165,108,'],
    sea:   'rgba(240,235,226,',
  } : {
    fg:    '#141212',
    fgA:   'rgba(20,18,18,',
    land:  ['rgba(90,107,74,', 'rgba(179,165,184,', 'rgba(181,159,154,'],
    sea:   'rgba(20,18,18,',
  };
}

// ====== NOISE ======
function hash(x, y, s) {
  const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.3) * 43758.5453;
  return n - Math.floor(n);
}
function snoise(x, y, s) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy);
  return hash(ix,iy,s)*(1-ux)*(1-uy)
       + hash(ix+1,iy,s)*ux*(1-uy)
       + hash(ix,iy+1,s)*(1-ux)*uy
       + hash(ix+1,iy+1,s)*ux*uy;
}

// ====== GEOMETRY ======
function makeBlob(cx, cy, baseR, numPts, seed, W, H) {
  const px = cx*W, py = cy*H, r = baseR * Math.min(W,H);
  const pts = [];
  for (let i = 0; i < numPts; i++) {
    const a = (i/numPts)*Math.PI*2;
    const n = snoise(Math.cos(a)*2.5 + seed*10, Math.sin(a)*2.5 + seed*10, seed);
    const rad = r * (0.65 + n*0.70);
    pts.push({ x: px + Math.cos(a)*rad, y: py + Math.sin(a)*rad });
  }
  return pts;
}

function drawSmooth(ctx, pts) {
  const n = pts.length;
  if (n < 2) return;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i-1+n)%n], p1 = pts[i], p2 = pts[(i+1)%n], p3 = pts[(i+2)%n];
    if (i === 0) ctx.moveTo(p1.x, p1.y);
    ctx.bezierCurveTo(
      p1.x+(p2.x-p0.x)/6, p1.y+(p2.y-p0.y)/6,
      p2.x-(p3.x-p1.x)/6, p2.y-(p3.y-p1.y)/6,
      p2.x, p2.y
    );
  }
  ctx.closePath();
}

function scaledBlob(pts, cx, cy, s) {
  return pts.map(p => ({ x: cx+(p.x-cx)*s, y: cy+(p.y-cy)*s }));
}

// ====== CANVAS ======
const canvas = document.getElementById('map');
const ctx    = canvas.getContext('2d');
const offscreen = document.createElement('canvas');
const offCtx    = offscreen.getContext('2d');
let W = 0, H = 0;
let cursorX = null, cursorY = null;
let focused = null; // tap-to-focus selection (touch screens)

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = W * dpr; canvas.height = H * dpr;
  canvas.style.width  = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
  offscreen.width  = canvas.width;
  offscreen.height = canvas.height;
  offCtx.setTransform(1, 0, 0, 1, 0, 0);
  offCtx.scale(dpr, dpr);
}

// ====== DRAW TERRAIN (offscreen; p < 1 only during the intro animation) ======
function drawTerrain(p = 1) {
  if (!W) return;
  const C = palette();
  const easeP = t => Math.min(Math.max(t, 0), 1);
  const late = easeP((p - 0.55) / 0.45); // connections, labels, furniture appear after the islands
  offCtx.clearRect(0, 0, W, H);

  // sea texture
  offCtx.save();
  offCtx.strokeStyle = C.sea + '0.04)';
  offCtx.lineWidth = 0.5;
  const lg = Math.max(H/80, 6);
  for (let y = 0; y < H; y += lg) {
    offCtx.beginPath(); offCtx.moveTo(0, y); offCtx.lineTo(W, y); offCtx.stroke();
  }
  offCtx.restore();

  // coordinate grid
  offCtx.save();
  offCtx.strokeStyle = C.fgA + '0.05)';
  offCtx.lineWidth = 0.5;
  for (let x = W/9; x < W; x += W/9) {
    offCtx.beginPath(); offCtx.moveTo(x, 0); offCtx.lineTo(x, H); offCtx.stroke();
  }
  for (let y = H/7; y < H; y += H/7) {
    offCtx.beginPath(); offCtx.moveTo(0, y); offCtx.lineTo(W, y); offCtx.stroke();
  }
  offCtx.restore();

  // zoom transform for map content on narrow screens
  const zoom = getZoom();
  const { ox, oy } = getOffset(zoom);
  offCtx.save();
  offCtx.translate(ox, oy);
  offCtx.scale(zoom, zoom);

  // territories
  const T = isPortrait() ? TERRITORIES_PORTRAIT : TERRITORIES;
  T.forEach((t, i) => {
    const li = easeP(p * 1.6 - i * 0.07); // staggered island reveal
    if (li === 0) return;
    let pts = makeBlob(t.cx, t.cy, t.r, t.pts, t.seed, W, H);
    const px  = t.cx*W, py = t.cy*H;
    if (li < 1) pts = scaledBlob(pts, px, py, 0.86 + 0.14 * li);
    const lc  = C.land[i % 3];

    offCtx.save();
    offCtx.globalAlpha = li;

    drawSmooth(offCtx, pts);
    offCtx.fillStyle = lc + '0.12)';
    offCtx.fill();

    drawSmooth(offCtx, pts);
    offCtx.save();
    offCtx.clip();
    offCtx.strokeStyle = lc + '0.09)';
    offCtx.lineWidth = 0.5;
    for (let d = -(H+W); d < W+H; d += 7) {
      offCtx.beginPath(); offCtx.moveTo(d, 0); offCtx.lineTo(d+H, H); offCtx.stroke();
    }
    offCtx.restore();

    [0.76, 0.54].forEach(s => {
      drawSmooth(offCtx, scaledBlob(pts, px, py, s));
      offCtx.strokeStyle = lc + '0.18)';
      offCtx.lineWidth = 0.7;
      offCtx.stroke();
    });

    drawSmooth(offCtx, pts);
    offCtx.strokeStyle = lc + '0.52)';
    offCtx.lineWidth = 1.2;
    offCtx.stroke();

    offCtx.restore();
  });

  // connection paths (dashed)
  offCtx.save();
  offCtx.globalAlpha = late;
  offCtx.setLineDash([3, 9]);
  offCtx.lineWidth = 0.8;
  offCtx.strokeStyle = C.fgA + '0.12)';
  CONNECTIONS.forEach(([aId, bId], ci) => {
    const a = PLACES.find(p => p.id === aId);
    const b = PLACES.find(p => p.id === bId);
    if (!a || !b) return;
    const ax = PX(a), ay = PY(a), bx = PX(b), by = PY(b);
    const off = (hash(ci, 0, 55) - 0.5) * Math.min(W,H) * 0.07;
    offCtx.beginPath();
    offCtx.moveTo(ax, ay);
    offCtx.quadraticCurveTo((ax+bx)/2+off, (ay+by)/2 - Math.abs(off)*0.5, bx, by);
    offCtx.stroke();
  });
  offCtx.setLineDash([]);
  offCtx.restore();

  // place dots + labels (label side flips in portrait; hit rects stored on each place)
  PLACES.forEach(p => {
    const px = PX(p), py = PY(p);
    const isProject = p.type === 'project';
    const left = isPortrait() && p.side === 'L';

    offCtx.save();
    offCtx.fillStyle = C.fg;
    offCtx.beginPath();
    offCtx.arc(px, py, isProject ? 3.5 : 2.5, 0, Math.PI*2);
    offCtx.globalAlpha = (isProject ? 0.78 : 0.38) * late;
    offCtx.fill();
    if (isProject) {
      offCtx.beginPath();
      offCtx.arc(px, py, 7, 0, Math.PI*2);
      offCtx.strokeStyle = C.fg;
      offCtx.globalAlpha = 0.15 * late;
      offCtx.lineWidth = 0.8;
      offCtx.stroke();
    }
    offCtx.restore();

    offCtx.save();
    offCtx.fillStyle = C.fg;
    offCtx.textAlign = left ? 'right' : 'left';
    if (isProject) {
      const hasL2 = !!p.label2;
      const lx = left ? px - 13 : px + 13;
      offCtx.globalAlpha = 0.82 * late;
      offCtx.font = 'italic 400 17px "EB Garamond", Georgia, serif';
      const lw = Math.max(
        offCtx.measureText(p.label).width,
        hasL2 ? offCtx.measureText(p.label2).width : 0
      );
      offCtx.fillText(p.label, lx, py + (hasL2 ? -10 : -5));
      if (hasL2) offCtx.fillText(p.label2, lx, py+7);
      if (p.sub) {
        offCtx.globalAlpha = 0.30 * late;
        offCtx.font = '300 9px "Inter", system-ui, sans-serif';
        offCtx.fillText(p.sub, lx, py + (hasL2 ? 20 : 9));
      }
      p._hit = {
        x0: left ? px - 13 - lw : px - 14,
        x1: left ? px + 14 : px + 13 + lw,
        y0: py - (hasL2 ? 26 : 20),
        y1: py + (hasL2 ? 28 : 18),
      };
    } else {
      const big = p.id === 'about';
      const lx = left ? px - 10 : px + 10;
      offCtx.globalAlpha = (big ? 0.5 : 0.36) * late;
      offCtx.font = (big ? '300 15px' : '300 9px') + ' "Inter", system-ui, sans-serif';
      const lw = offCtx.measureText(p.label.toUpperCase()).width;
      offCtx.fillText(p.label.toUpperCase(), lx, py + (big ? 5 : 4));
      p._hit = {
        x0: left ? px - 10 - lw : px - 12,
        x1: left ? px + 12 : px + 10 + lw,
        y0: py - 16,
        y1: py + 16,
      };
    }
    offCtx.restore();
  });

  // scale bar
  drawScaleBar(offCtx, W/2, isPortrait() ? H - 30 : H - 28, 72, C, late);

  // title ghost (bottom left on desktop, top left in portrait)
  offCtx.save();
  const ts = isPortrait()
    ? Math.max(22, Math.min(W*0.075, 32))
    : Math.max(26, Math.min(W*0.038, 48));
  offCtx.globalAlpha = 0.12 * late;
  offCtx.fillStyle = C.fg;
  offCtx.font = `italic 400 ${ts}px "EB Garamond", Georgia, serif`;
  if (isPortrait()) offCtx.fillText('Messy Sensing', 20, 24 + ts);
  else offCtx.fillText('Messy Sensing', 44, H - 40);
  offCtx.restore();

  offCtx.restore(); // end zoom transform
}

// Composite terrain + live compass + focus halo (called on every mousemove / focus change)
function drawFrame() {
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(offscreen, 0, 0, W, H);
  if (isPortrait()) drawCompass(ctx, W-54, 132, 26, palette(), cursorX, cursorY);
  else drawCompass(ctx, W-58, H-66, 28, palette(), cursorX, cursorY);
  if (focused) {
    const zoom = getZoom(), { ox, oy } = getOffset(zoom);
    const fx = ox + PX(focused)*zoom, fy = oy + PY(focused)*zoom;
    const C = palette();
    ctx.save();
    ctx.fillStyle = C.fg;
    ctx.strokeStyle = C.fg;
    ctx.globalAlpha = 0.08;
    ctx.beginPath(); ctx.arc(fx, fy, 24, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(fx, fy, 13, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
}

function draw(p = 1) {
  drawTerrain(p);
  drawFrame();
}

// Compass needle follows cursor. mx/my are null when cursor is off-canvas.
function drawCompass(ctx, cx, cy, r, C, mx, my) {
  ctx.save();
  ctx.strokeStyle = C.fg;
  ctx.fillStyle   = C.fg;

  // outer ring
  ctx.globalAlpha = 0.17;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.stroke();

  // tick marks
  for (let i = 0; i < 8; i++) {
    const a = (i/8)*Math.PI*2;
    ctx.globalAlpha = i%2===0 ? 0.14 : 0.07;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r*0.82, cy+Math.sin(a)*r*0.82);
    ctx.lineTo(cx+Math.cos(a)*r,      cy+Math.sin(a)*r);
    ctx.stroke();
  }

  // main needle — points toward cursor, confidently labeled "N"
  const needleAngle = (mx !== null && my !== null)
    ? Math.atan2(my - cy, mx - cx)
    : 148 * Math.PI/180 - Math.PI/2;

  const tx = cx + Math.cos(needleAngle)*r*0.78;
  const ty = cy + Math.sin(needleAngle)*r*0.78;

  ctx.globalAlpha = 0.40;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(tx, ty);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx+Math.cos(needleAngle+2.5)*6, ty+Math.sin(needleAngle+2.5)*6);
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx+Math.cos(needleAngle-2.5)*6, ty+Math.sin(needleAngle-2.5)*6);
  ctx.stroke();

  ctx.globalAlpha = 0.46;
  ctx.font = 'italic 400 11px "EB Garamond", Georgia, serif';
  ctx.textAlign = 'left';
  ctx.fillText('N', tx+Math.cos(needleAngle)*9, ty+Math.sin(needleAngle)*9+4);

  // second confused mini-arrow, fixed direction, labeled "N?"
  const confused = 312 * Math.PI/180 - Math.PI/2;
  const ex = cx+Math.cos(confused)*r*0.44;
  const ey = cy+Math.sin(confused)*r*0.44;
  ctx.globalAlpha = 0.13;
  ctx.lineWidth = 0.7;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.globalAlpha = 0.17;
  ctx.font = '300 7px "Inter", system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('N?', ex+2, ey);

  // disclaimer
  ctx.globalAlpha = 0.17;
  ctx.font = '300 6.5px "Inter", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('calibration pending', cx, cy+r+11);
  ctx.fillText('est. 2019', cx, cy+r+19);

  ctx.restore();
}

function drawScaleBar(ctx, cx, cy, len, C, a = 1) {
  ctx.save();
  ctx.globalAlpha = 0.16 * a;
  ctx.strokeStyle = C.fg;
  ctx.fillStyle   = C.fg;
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(cx-len/2, cy); ctx.lineTo(cx+len/2, cy);
  ctx.moveTo(cx-len/2, cy-3); ctx.lineTo(cx-len/2, cy+3);
  ctx.moveTo(cx+len/2, cy-3); ctx.lineTo(cx+len/2, cy+3);
  ctx.stroke();
  ctx.font = '300 7px "Inter", system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('distances may vary', cx, cy+12);
  ctx.restore();
}

// ====== LAYOUT MODE / ZOOM ======
function isPortrait() { return H > W; }
// Place coordinates: portrait set when available and the viewport is portrait.
function PX(p) { return (isPortrait() && p.px != null ? p.px : p.x) * W; }
function PY(p) { return (isPortrait() && p.py != null ? p.py : p.y) * H; }
// The 0.72 shrink is only needed for narrow LANDSCAPE windows; portrait has its own coords.
function getZoom() { return (!isPortrait() && W < 700) ? 0.72 : 1; }
function getOffset(zoom) { return { ox: W*(1-zoom)/2, oy: H*(1-zoom)/2 }; }

// ====== HIT TEST ======
// Uses the label rects measured during drawTerrain (p._hit), so taps can't land
// on a neighbour's oversized hit band. `pad` widens everything for fingers.
function hitPlace(mx, my, pad = 0) {
  const zoom = getZoom();
  const { ox, oy } = getOffset(zoom);
  const tx = (mx - ox) / zoom;
  const ty = (my - oy) / zoom;
  return PLACES.find(p => {
    const px = PX(p), py = PY(p);
    const dx = px - tx, dy = py - ty;
    if (Math.sqrt(dx*dx+dy*dy) < 20 + pad) return true;
    const r = p._hit;
    return r && tx >= r.x0 - pad && tx <= r.x1 + pad && ty >= r.y0 - pad && ty <= r.y1 + pad;
  });
}

const COMP_L = ['#9B5A78', '#6B8A4A', '#4A6B8A'];
const COMP_D = ['#C87860', '#78B870', '#6C7FC8'];

canvas.addEventListener('mousemove', e => {
  cursorX = e.clientX;
  cursorY = e.clientY;
  const p = hitPlace(e.clientX, e.clientY);
  canvas.classList.toggle('hovering', !!p);
  const comp = document.getElementById('cursor-blob');
  if (comp) {
    if (p && p.type === 'project') {
      const idx = PLACES.indexOf(p);
      comp.style.color = (isDark() ? COMP_D : COMP_L)[idx % 3];
    } else {
      comp.style.color = '';
    }
  }
  drawFrame();
});
canvas.addEventListener('mouseleave', () => {
  cursorX = null;
  cursorY = null;
  const comp = document.getElementById('cursor-blob');
  if (comp) comp.style.color = '';
  drawFrame();
});
// ====== TAP-TO-FOCUS (touch) ======
// First tap selects a place (halo + card), second tap on the same place navigates.
// Mouse clicks keep navigating directly.
const card = document.getElementById('place-card');

function focusPlace(p) {
  focused = p || null;
  if (focused) {
    card.href = focused.href;
    card.querySelector('.pc-title').textContent =
      focused.label + (focused.label2 ? ' ' + focused.label2 : '');
    card.querySelector('.pc-sub').textContent = focused.sub || '';
    card.classList.add('show');
    card.setAttribute('aria-hidden', 'false');
    card.removeAttribute('tabindex');
  } else {
    card.classList.remove('show');
    card.setAttribute('aria-hidden', 'true');
    card.setAttribute('tabindex', '-1');
  }
  drawFrame();
}

let lastTouch = 0;
let touchStart = null;

canvas.addEventListener('touchstart', e => {
  const t = e.touches[0];
  touchStart = { x: t.clientX, y: t.clientY };
}, { passive: true });

canvas.addEventListener('touchend', e => {
  lastTouch = Date.now();
  const t = e.changedTouches[0];
  if (touchStart && Math.hypot(t.clientX - touchStart.x, t.clientY - touchStart.y) > 12) return;
  const p = hitPlace(t.clientX, t.clientY, 14);
  if (!p) { focusPlace(null); return; }
  if (p === focused) { window.location.href = p.href; return; }
  focusPlace(p);
}, { passive: true });

canvas.addEventListener('click', e => {
  if (Date.now() - lastTouch < 700) return; // synthetic click after a touch tap
  const p = hitPlace(e.clientX, e.clientY);
  if (p) window.location.href = p.href;
});

// ====== LEGEND TOGGLE (chip on small screens) ======
const legendEl = document.getElementById('map-legend');
const legendToggle = document.getElementById('legend-toggle');
legendToggle.addEventListener('click', () => {
  const open = legendEl.classList.toggle('open');
  legendToggle.setAttribute('aria-expanded', String(open));
});

// ====== BLOB CURSOR ======
if (window.matchMedia('(pointer: fine)').matches) (function () {
  const blob = document.createElement('div');
  blob.id = 'cursor-blob';
  blob.className = 'hidden';
  blob.innerHTML = '<svg width="16" height="21" viewBox="0 0 16 21" fill="currentColor" xmlns="http://www.w3.org/2000/svg">'
    + '<path transform="rotate(180,8,10.5)" d="M2,2 L2,14 L5.5,10.5 L8.5,19 L11,18 L8,10 L14,10 Z"/>'
    + '</svg>';
  document.body.appendChild(blob);

  document.addEventListener('mousemove', e => {
    blob.style.transform = 'translate(' + (e.clientX - 14) + 'px,' + (e.clientY - 19) + 'px)';
    blob.classList.remove('hidden');
  });
  document.addEventListener('mouseleave', () => blob.classList.add('hidden'));
})();

// ====== INIT ======
window.addEventListener('resize', () => { resize(); draw(); if (focused) focusPlace(focused); });
// First visit per session: the map draws itself in. Skipped for reduced motion.
function intro() {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || sessionStorage.getItem('ms-intro')) { draw(); return; }
  sessionStorage.setItem('ms-intro', '1');
  const t0 = performance.now(), DUR = 1400;
  requestAnimationFrame(function tick(now) {
    const t = Math.min((now - t0) / DUR, 1);
    draw(1 - Math.pow(1 - t, 3)); // ease-out cubic
    if (t < 1) requestAnimationFrame(tick);
  });
}

document.fonts.ready.then(() => {
  resize();
  intro();
  // debug hooks for screenshots/testing: ?focus=<place-id>&legend=open
  const q = new URLSearchParams(location.search);
  const f = q.get('focus');
  if (f) { const p = PLACES.find(p => p.id === f); if (p) focusPlace(p); }
  if (q.get('legend') === 'open') legendToggle.click();
});
</script>
</body>
